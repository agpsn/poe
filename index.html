<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kingsmarch Shipment + Workforce Calculator</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1f2630;--text:#e6edf3;--muted:#9da7b3;--border:#303846;--accent:#d7a84a;--ok:#3fb950;--bad:#f85149;--warn:#d29922}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:24px 18px 14px;max-width:1300px;margin:auto} h1{margin:0 0 5px;font-size:25px} h2{margin:0 0 14px} h3{margin:0 0 10px} .sub{color:var(--muted)}
main{max-width:1300px;margin:auto;padding:0 18px 35px}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 18px;position:sticky;top:0;background:rgba(13,17,23,.96);padding:9px 0;z-index:5}
button,.tab{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:650}.tab.active{background:var(--accent);color:#17130a;border-color:var(--accent)}button:hover{filter:brightness(1.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}.wide{grid-column:1/-1}
label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input,select{width:100%;background:#0d1117;border:1px solid var(--border);border-radius:7px;color:var(--text);padding:8px}input[type=number]{font-variant-numeric:tabular-nums}
.field{margin-bottom:10px}.row{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:end}.assignment{border:1px solid var(--border);border-radius:10px;padding:11px;margin:8px 0;background:var(--panel2)}.assignment strong{display:block;margin-bottom:8px}.workers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}.stat{background:var(--panel2);border-radius:9px;padding:11px}.stat b{display:block;font-size:18px;margin-top:3px}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--border);padding:8px;text-align:left}th{color:var(--muted);font-weight:600}.num{text-align:right}.success{color:var(--ok)}.error{color:var(--bad)}.warning{color:var(--warn)}.notice{padding:10px;border-radius:8px;background:var(--panel2);margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px;color:var(--muted)}.shipment-input{max-width:190px}.nowrap{white-space:nowrap}
@media(max-width:650px){header{padding:18px 12px 10px}main{padding:0 12px 25px}.tabs{position:static}.row{grid-template-columns:1fr 95px}table{font-size:12px}th,td{padding:6px}}
</style>
</head>
<body>
<header>
<h1>⚒️ Kingsmarch Shipment + Workforce Calculator</h1>
<div class="sub">Standalone PoE 1 Kingsmarch calculator · <strong>Game version: 3.29.3</strong> · All data stays in this browser.</div>
</header>
<main>
<div class="tabs" id="tabs"></div>
<section id="app"></section>
</main>
<script>
const resources=[
["Crimson Iron Ore",4],["Orichalcum Ore",5],["Petrified Amber Ore",7],["Bismuth Ore",12],["Verisium Ore",22],
["Crimson Iron Bar",16],["Orichalcum Bar",22],["Petrified Amber Bar",30],["Bismuth Bar",50],["Verisium Bar",90],
["Wheat",12],["Corn",15],["Pumpkin",18],["Orgourd",21],["Blue Zanthimum",24],["Thaumaturgic Dust",1]
];
const cats=[
{id:"farming",icon:"🌾",name:"Farming",max:18,items:[["Plot 1",3],["Plot 2",3],["Plot 3",3],["Plot 4",3],["Plot 5",3],["Plot 6",3]]},
{id:"mining",icon:"⛏️",name:"Mining",max:60,items:[["Crimson Iron",12],["Orichalcum",12],["Petrified Amber",12],["Bismuth",12],["Verisium",12]]},
{id:"smelting",icon:"🔥",name:"Smelting",max:30,items:[["Crimson Iron",6],["Orichalcum",6],["Petrified Amber",6],["Bismuth",6],["Verisium",6]]},
{id:"disenchanting",icon:"👻",name:"Disenchanting",max:6,items:[["Disenchanting",6]]},
{id:"mapping",icon:"🗺️",name:"Mapping",max:18,items:[["Map 1",6],["Map 2",6],["Map 3",6]]},
{id:"shipping",icon:"🚢",name:"Shipping",max:18,items:[["Ship 1",6],["Ship 2",6],["Ship 3",6]]}
];
const defaults={duration:0,currentGold:0,otherGold:0,target:0};
if(!localStorage.getItem("kingsmarchCalc_v3")){localStorage.removeItem("kingsmarchCalc");localStorage.setItem("kingsmarchCalc_v3","1");}
let state=JSON.parse(localStorage.getItem("kingsmarchCalc")||"null")||{
ship:{target:0,reserve:Object.fromEntries(resources.map(r=>[r[0],0])),inventory:Object.fromEntries(resources.map(r=>[r[0],0]))},
work:{},duration:1,currentGold:0,otherGold:0,tab:"shipment"
};
cats.forEach(c=>c.items.forEach(([name,max])=>{
 if(state.work[c.id+"|"+name]===undefined)state.work[c.id+"|"+name]=0;
}));
function save(){localStorage.setItem("kingsmarchCalc",JSON.stringify(state))}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(n){return Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2})}
function tabs(){
let a=[["shipment","📦 Shipment"],...cats.map(c=>[c.id,c.icon+" "+c.name]),["totals","📊 Totals"]];
document.getElementById("tabs").innerHTML=a.map(([id,t])=>`<button class="tab ${state.tab===id?"active":""}" onclick="state.tab='${id}';save();render()">${t}</button>`).join("");
}
function render(){tabs();let a=document.getElementById("app");if(state.tab==="shipment")a.innerHTML=shipment();else if(state.tab==="totals")a.innerHTML=totals();else a.innerHTML=workPage(cats.find(c=>c.id===state.tab));bind()}
function bind(){
document.querySelectorAll("[data-path]").forEach(el=>el.oninput=()=>{
let p=el.dataset.path.split("."),o=state;
for(let i=0;i<p.length-1;i++)o=o[p[i]];
o[p[p.length-1]]=Number(el.value)||0;
save();
if(state.tab==="shipment") updateShipmentPreview();
else if(state.tab==="totals") updateTotalsPreview();
else render();
});
}
function updateTotalsPreview(){
const rows=cats.map(c=>{let workers=c.items.reduce((s,[n])=>s+activeCount(c.id+"|"+n),0);return {c,workers,h:catHourly(c),hire:catHire(c)}});
const hourly=rows.reduce((s,r)=>s+r.h,0),hire=rows.reduce((s,r)=>s+r.hire,0),duration=Number(state.duration)||0;
const wages=hourly*duration,other=Number(state.otherGold)||0,required=hire+wages+other,current=Number(state.currentGold)||0,remain=current-required;
const els={
hourly:document.querySelector(".tot-hourly"),wages:document.querySelector(".tot-wages"),hire:document.querySelector(".tot-hire"),
required:document.querySelector(".tot-required"),remaining:document.querySelector(".tot-remaining"),workers:document.querySelector(".tot-workers")
};
if(els.hourly)els.hourly.textContent=fmt(hourly);
if(els.wages)els.wages.textContent=fmt(wages);
if(els.hire)els.hire.textContent=fmt(hire);
if(els.required)els.required.textContent=fmt(required);
if(els.remaining){els.remaining.textContent=fmt(Math.abs(remain));els.remaining.className=remain>=0?"success":"error"}
if(els.workers)els.workers.textContent=fmt(globalWorkers())+" / 90";
const table=document.querySelector(".totals-table");
if(table){
rows.forEach((r,i)=>{
const cells=table.querySelectorAll("tbody tr")[i]?.querySelectorAll("td");
if(!cells)return;
cells[1].textContent=fmt(r.workers);cells[3].textContent=fmt(r.h);cells[4].textContent=fmt(r.h*duration);cells[5].textContent=fmt(r.hire);
});
const foot=table.querySelector("tbody tr:last-child")?.querySelectorAll("th");
if(foot){foot[1].textContent=fmt(globalWorkers());foot[3].textContent=fmt(hourly);foot[4].textContent=fmt(wages);foot[5].textContent=fmt(hire)}
}
}
function updateShipmentPreview(){
const inv=state.ship.inventory,res=state.ship.reserve,target=Number(state.ship.target)||0;
const available=resources.map(r=>Math.max(0,(Number(inv[r[0]])||0)-(Number(res[r[0]])||0)));
const chosen=computeShipment(target,available);
const totalEl=document.querySelector(".shipment-total-value");
const itemsEl=document.querySelector(".shipment-item-count");
const statusEl=document.querySelector(".shipment-status");
const messageEl=document.querySelector(".shipment-message");
if(totalEl) totalEl.textContent=fmt(chosen.total);
if(itemsEl) itemsEl.textContent=fmt(chosen.items);
if(statusEl){
statusEl.textContent=chosen.total===target?"✓ Reached":"− "+fmt(target-chosen.total);
statusEl.className=""+(chosen.total===target?"success":"error");
}
if(messageEl){
messageEl.className="notice shipment-message "+(chosen.total===target?"success":"error");
messageEl.textContent=chosen.total===target
?"Exact shipment value reached."
:"Exact shipment cannot be achieved with the available/reserved inventory. The maximum practical shipment found is "+fmt(chosen.total)+" ("+fmt(target-chosen.total)+" short). You can add inventory, reduce reserves, or change the target.";
}
const rows=document.querySelectorAll("tbody tr");
resources.forEach((r,i)=>{
const n=chosen.qty[i], remain=Math.max(0,(Number(inv[r[0]])||0)-n);
const row=rows[i]; if(!row)return;
const cells=row.querySelectorAll("td");
if(cells[4])cells[4].textContent=fmt(n);
if(cells[5])cells[5].textContent=fmt(remain);
if(cells[6])cells[6].textContent=fmt(n*r[1]);
});
}
function shipment(){
let inv=state.ship.inventory,res=state.ship.reserve,target=Number(state.ship.target)||0;
let available=resources.map(r=>Math.max(0,(Number(inv[r[0]])||0)-(Number(res[r[0]])||0)));
let chosen=computeShipment(target,available), total=chosen.total;
return `<div class="grid">
<div class="card"><h2>📦 Shipment setup</h2>
<div class="field"><label>Desired total shipment value</label><input class="shipment-input" type="number" min="0" step="1" data-path="ship.target" value="${state.ship.target}"></div>
<div class="notice">Dust is used only for the remaining value, and Dust sent can never exceed the requested shipment value.</div>
<div class="actions" style="margin-top:12px"><button onclick="demoShip()">Load demo inventory</button><button onclick="resetShip()">Reset shipment</button></div></div>
<div class="card"><h2>Result</h2><div class="statgrid">
<div class="stat">Target<b>${fmt(target)}</b></div><div class="stat">Shipment value<b class="shipment-total-value">${fmt(total)}</b></div><div class="stat">Items<b class="shipment-item-count">${fmt(chosen.items)}</b></div>
<div class="stat">${total===target?"Exact":"Shortfall"}<b class="${total===target?"success":"error"} shipment-status">${total===target?"✓ Reached":"− "+fmt(target-total)}</b></div></div>
<div class="notice ${total===target?"success":"error"} shipment-message">${total===target?"Exact shipment value reached.":"Exact shipment cannot be achieved with the available/reserved inventory. The maximum practical shipment found is "+fmt(total)+" ("+fmt(target-total)+" short). You can add inventory, reduce reserves, or change the target."}</div></div>
<div class="card wide"><h2>Resources</h2><div style="overflow:auto"><table><thead><tr><th>Resource</th><th class="num">Value/unit</th><th class="num">Current inventory</th><th class="num">Reserve</th><th class="num">Send</th><th class="num">Remaining</th><th class="num">Value contributed</th></tr></thead><tbody>
${resources.map((r,i)=>{let n=chosen.qty[i],remain=Math.max(0,(Number(inv[r[0]])||0)-n);return `<tr><td>${esc(r[0])}</td><td class="num">${r[1]}</td><td class="num"><input type="number" min="0" step="1" data-path="ship.inventory.${esc(r[0])}" value="${inv[r[0]]||0}"></td><td class="num"><input type="number" min="0" step="1" data-path="ship.reserve.${esc(r[0])}" value="${res[r[0]]||0}"></td><td class="num">${fmt(n)}</td><td class="num">${fmt(remain)}</td><td class="num">${fmt(n*r[1])}</td></tr>`}).join("")}</tbody></table></div></div></div>`;
}
function computeShipment(target,avail){
let n=avail.length,qty=Array(n).fill(0),dust=n-1;
let remaining=target;
let nonDust=avail.map((a,i)=>i===dust?0:a);
if(target<=0)return {qty,total:0,items:0};
let best=null;
function consider(q){let v=q.reduce((s,x,i)=>s+x*resources[i][1],0);let it=q.reduce((s,x)=>s+x,0);let exact=v===target;let score=exact?1e12+it*-0.01:v; if(!best||score>best.score)best={q:q.slice(),v,it,score};}
function greedy(){let q=Array(n).fill(0),rem=target;let order=nonDust.map((a,i)=>[i,a]).sort((a,b)=>resources[b[0]][1]-resources[a[0]][1]);
for(const [i,a] of order){let take=Math.min(a,Math.floor(rem/resources[i][1]));q[i]=take;rem-=take*resources[i][1]}
q[dust]=Math.min(avail[dust],Math.max(0,rem));consider(q)}
greedy();
function dfs(i,rem,q,steps){
if(i===n-1){let take=Math.min(avail[dust],rem);q[dust]=take;consider(q);q[dust]=0;return}
if(steps>350000)return;
let val=resources[i][1],max=Math.min(avail[i],Math.floor(rem/val));
for(let x=max;x>=Math.max(0,max-80);x--){q[i]=x;dfs(i+1,rem-x*val,q,steps+1);if(best&&best.v===target)break}
q[i]=0}
if(target<=2500 && n<=16)dfs(0,target,Array(n).fill(0),0);
let q=best.q,total=best.v;return {qty:q,total,items:q.reduce((s,x)=>s+x,0)};
}
function workPage(c){
let total=c.items.reduce((s,[n])=>s+activeCount(c.id+"|"+n),0);
let global=globalWorkers(),over=total>c.max||global>90;
return `<div class="card"><h2>${c.icon} ${c.name}</h2><div class="notice">Workers are <b>inactive until their Wage / hour is greater than 0</b>. Only active workers count toward the 90-worker global limit and gold totals.</div><div class="statgrid"><div class="stat">Workers<b>${fmt(total)} / ${c.max}</b></div><div class="stat">Global<b>${fmt(global)} / 90</b></div><div class="stat">Hourly wages<b>${fmt(catHourly(c))}</b></div><div class="stat">Hire costs<b>${fmt(catHire(c))}</b></div></div>
${over?`<div class="notice error">⚠️ Invalid allocation: ${total>c.max?c.name+" exceeds its maximum. ":""}${global>90?"Global workforce exceeds 90.":""}</div>`:""}
<div class="card" style="margin-top:14px"><h3>Assignments</h3>${c.items.map(([name,max])=>assignment(c,name,max)).join("")}</div></div>`;
}
function assignment(c,name,max){
let key=c.id+"|"+name,count=Math.min(max,Math.max(0,state.work[key]||0)), workers=state.workers?.[key]||[];
if(!state.workers)state.workers={};
while(workers.length<count)workers.push({level:1,hire:0,wage:0});
workers=workers.slice(0,count);state.workers[key]=workers;
return `<div class="assignment"><div class="row"><strong>${esc(name)} <span class="small">(max ${max})</span> <span class="small">· active ${activeCount(key)}</span></strong><input type="number" min="0" max="${max}" step="1" value="${count}" onchange="setCount('${key}',this.value)"></div>
${count?`<div class="workers">${workers.map((w,i)=>`<div><strong>Worker ${i+1}</strong><div class="field"><label>Level / rank</label><input type="number" min="0" step="1" value="${w.level}" onchange="setWorker('${key}',${i},'level',this.value)"></div><div class="field"><label>Hire cost</label><input type="number" min="0" step="1" value="${w.hire}" onchange="setWorker('${key}',${i},'hire',this.value)"></div><div class="field"><label>Wage / hour</label><input type="number" min="0" step="0.01" value="${w.wage}" onchange="setWorker('${key}',${i},'wage',this.value)"></div></div>`).join("")}</div>`:"<div class='small'>No workers assigned.</div>"}</div>`;
}
function setCount(key,v){let n=Math.max(0,Math.floor(Number(v)||0));let c=cats.find(c=>c.items.some(x=>c.id+"|"+x[0]===key)),item=c.items.find(x=>c.id+"|"+x[0]===key);n=Math.min(n,item[1]);let projected=globalWorkers()-activeCount(key)+((state.workers?.[key]||[]).slice(0,n).filter(z=>(Number(z.wage)||0)>0).length);if(projected>90){alert("Global workforce limit is 90 active workers. Reduce another assignment or remove wages first.");return}state.work[key]=n;save();render()}
function setWorker(key,i,p,v){if(!state.workers)state.workers={};if(!state.workers[key])state.workers[key]=[];state.workers[key][i] ||= {level:1,hire:0,wage:0};state.workers[key][i][p]=Number(v)||0;save();render()}
function activeCount(key){let w=state.workers?.[key]||[],count=state.work[key]||0;return w.slice(0,count).filter(z=>(Number(z.wage)||0)>0).length}
function globalWorkers(){return cats.reduce((s,c)=>s+c.items.reduce((x,[n])=>x+activeCount(c.id+"|"+n),0),0)}
function catHourly(c){return c.items.reduce((s,[n])=>{let k=c.id+"|"+n,w=state.workers?.[k]||[],count=state.work[k]||0;return s+w.slice(0,count).reduce((a,z)=>a+(Number(z.wage)||0),0)},0)}
function catHire(c){return c.items.reduce((s,[n])=>{let k=c.id+"|"+n,w=state.workers?.[k]||[],count=state.work[k]||0;return s+w.slice(0,count).reduce((a,z)=>a+(Number(z.hire)||0),0)},0)}
function totals(){
let rows=cats.map(c=>{let workers=c.items.reduce((s,[n])=>s+activeCount(c.id+"|"+n),0);return {c,workers,h:catHourly(c),hire:catHire(c)}});
let hourly=rows.reduce((s,r)=>s+r.h,0),hire=rows.reduce((s,r)=>s+r.hire,0),duration=Number(state.duration)||0,wages=hourly*duration,other=Number(state.otherGold)||0,required=hire+wages+other,current=Number(state.currentGold)||0,remain=current-required;
return `<div class="grid"><div class="card wide"><h2>📊 Workforce totals</h2><div class="statgrid"><div class="stat">Active workers<b class="tot-workers">${fmt(globalWorkers())} / 90</b></div><div class="stat">Hourly wages<b class="tot-hourly">${fmt(hourly)}</b></div><div class="stat">Voyage wages<b class="tot-wages">${fmt(wages)}</b></div><div class="stat">Hire costs<b class="tot-hire">${fmt(hire)}</b></div></div>
<div style="overflow:auto;margin-top:14px"><table class="totals-table"><thead><tr><th>Work Type</th><th class="num">Workers</th><th class="num">Maximum</th><th class="num">Hourly wages</th><th class="num">Voyage wages</th><th class="num">Hire cost</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.c.icon} ${r.c.name}</td><td class="num">${fmt(r.workers)}</td><td class="num">${r.c.max}</td><td class="num">${fmt(r.h)}</td><td class="num">${fmt(r.h*duration)}</td><td class="num">${fmt(r.hire)}</td></tr>`).join("")}<tr><th>TOTAL</th><th class="num">${fmt(globalWorkers())}</th><th class="num">90</th><th class="num">${fmt(hourly)}</th><th class="num">${fmt(wages)}</th><th class="num">${fmt(hire)}</th></tr></tbody></table></div></div>
<div class="card"><h2>💰 Gold</h2><div class="field"><label>Voyage/process duration (hours)</label><input type="number" min="0" step="0.01" data-path="duration" value="${state.duration}"></div><div class="field"><label>Other one-time gold costs</label><input type="number" min="0" step="1" data-path="otherGold" value="${state.otherGold}"></div><div class="field"><label>Current Gold</label><input type="number" min="0" step="1" data-path="currentGold" value="${state.currentGold}"></div><div class="statgrid"><div class="stat">Total gold required<b class="tot-required">${fmt(required)}</b></div><div class="stat">${remain>=0?"Gold remaining":"Gold shortage"}<b class="${remain>=0?"success":"error"} tot-remaining">${fmt(Math.abs(remain))}</b></div></div></div>
<div class="card"><h2>💾 Save / Load</h2>
<div class="actions">
<button onclick="exportData()">⬇️ Export Save</button>
<button onclick="document.getElementById('importFile').click()">⬆️ Import Save</button>
<button onclick="resetAll()">🔄 Reset Everything</button>
</div>
<input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(this)">
<div class="small" style="margin-top:10px">Export creates a JSON backup of your shipment, workforce, worker details, and gold settings. Import restores it later, including on another browser/device.</div></div>
<div class="card"><h2>⚙️ Workforce Tools</h2><div class="actions"><button onclick="demoWorkers()">Load demo workers</button><button onclick="clearWorkers()">Clear all workers</button></div></div></div>`;
}
function demoShip(){
const ranges=[
[20,150],[10,120],[8,100],[5,80],[3,60],
[5,60],[4,45],[3,35],[2,28],[1,20],
[20,180],[15,150],[10,120],[8,100],[5,80],[50,500]
];
resources.forEach((r,i)=>{
const [min,max]=ranges[i];
state.ship.inventory[r[0]]=Math.floor(Math.random()*(max-min+1))+min;
state.ship.reserve[r[0]]=0;
});
state.ship.target=Math.floor(Math.random()*1801)+200;
save();render()}
function resetShip(){state.ship={target:0,reserve:Object.fromEntries(resources.map(r=>[r[0],0])),inventory:Object.fromEntries(resources.map(r=>[r[0],0]))};save();render()}
function demoWorkers(){
state.workers=state.workers||{};
cats.forEach(c=>c.items.forEach(([n,max])=>{
const k=c.id+"|"+n;
let count=Math.floor(Math.random()*(max+1));
state.work[k]=count;
state.workers[k]=Array.from({length:count},()=>({
level:Math.floor(Math.random()*10)+1,
hire:Math.floor(Math.random()*4501)+500,
wage:Math.floor(Math.random()*81)+20
}));
}));

// Keep the random demo allocation within the 90-worker global limit.
let excess=globalAssignedWorkers()-90;
if(excess>0){
const keys=cats.flatMap(c=>c.items.map(([n])=>c.id+"|"+n));
for(const k of keys){
if(excess<=0)break;
const cut=Math.min(state.work[k]||0,excess);
state.work[k]-=cut;
state.workers[k].splice(state.work[k]);
excess-=cut;
}
}
save();render();
}
function globalAssignedWorkers(){
return cats.reduce((s,c)=>s+c.items.reduce((x,[n])=>x+(state.work[c.id+"|"+n]||0),0),0)
}
function clearWorkers(){cats.forEach(c=>c.items.forEach(([n])=>{state.work[c.id+"|"+n]=0;if(state.workers)state.workers[c.id+"|"+n]=[]}));save();render()}
function exportData(){
const payload={version:2,exportedAt:new Date().toISOString(),data:state};
const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="kingsmarch-calculator-save.json";
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importData(input){
const file=input.files&&input.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=()=>{
try{
const payload=JSON.parse(reader.result);
const data=payload&&payload.data?payload.data:payload;
if(!data||typeof data!=="object"||!data.ship||!data.work){
throw new Error("Invalid save file");
}
if(!data.ship.inventory||!data.ship.reserve||typeof data.ship.target==="undefined"){
throw new Error("Missing shipment data");
}
state={
ship:{
target:Number(data.ship.target)||0,
inventory:{...Object.fromEntries(resources.map(r=>[r[0],0])),...data.ship.inventory},
reserve:{...Object.fromEntries(resources.map(r=>[r[0],0])),...data.ship.reserve}
},
work:{...(data.work||{})},
workers:{...(data.workers||{})},
duration:Number(data.duration)||0,
currentGold:Number(data.currentGold)||0,
otherGold:Number(data.otherGold)||0,
tab:"totals"
};
cats.forEach(c=>c.items.forEach(([name,max])=>{
const key=c.id+"|"+name;
state.work[key]=Math.max(0,Math.min(max,Math.floor(Number(state.work[key])||0)));
state.workers[key]=Array.isArray(state.workers[key])?state.workers[key].slice(0,state.work[key]).map(w=>({
level:Number(w.level)||0,hire:Number(w.hire)||0,wage:Number(w.wage)||0
})):[];
}));
save();
input.value="";
render();
alert("Save imported successfully.");
}catch(e){
input.value="";
alert("Could not import that file. Please select a Kingsmarch Calculator JSON save.");
}
};
reader.onerror=()=>{input.value="";alert("Could not read the selected file.")};
reader.readAsText(file);
}
function resetAll(){if(confirm("Reset all calculator data? This will clear your shipment inventory, reserves, workforce, worker details, gold settings, and saved browser data.")){localStorage.removeItem("kingsmarchCalc");location.reload()}}
render();
</script>
</body>
</html>
