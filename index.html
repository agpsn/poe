<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kingsmarch Calculator</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1f2630;--text:#e6edf3;--muted:#9da7b3;--border:#303846;--accent:#d7a84a;--ok:#3fb950;--bad:#f85149;--warn:#d29922}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:24px 18px 14px;max-width:1300px;margin:auto} h1{margin:0 0 5px;font-size:25px} h2{margin:0 0 14px} h3{margin:0 0 10px} .sub{color:var(--muted)}
main{max-width:1300px;margin:auto;padding:0 18px 35px}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 18px;position:sticky;top:0;background:rgba(13,17,23,.96);padding:9px 0;z-index:5}
button,.tab{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:650}.tab.active{background:var(--accent);color:#17130a;border-color:var(--accent)}button:hover{filter:brightness(1.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}.wide{grid-column:1/-1}
label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input,select{width:100%;background:#0d1117;border:1px solid var(--border);border-radius:7px;color:var(--text);padding:8px}input[type=number]{font-variant-numeric:tabular-nums}
.field{margin-bottom:10px}.row{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:end}.assignment{border:1px solid var(--border);border-radius:10px;padding:11px;margin:8px 0;background:var(--panel2)}.assignment strong{display:block;margin-bottom:8px}.workers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}.stat{background:var(--panel2);border-radius:9px;padding:11px}.stat b{display:block;font-size:18px;margin-top:3px}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--border);padding:8px;text-align:left}th{color:var(--muted);font-weight:600}.num{text-align:right}.success{color:var(--ok)}.error{color:var(--bad)}.warning{color:var(--warn)}.notice{padding:10px;border-radius:8px;background:var(--panel2);margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px;color:var(--muted)}
.type-icon{width:28px;height:28px;object-fit:cover;border-radius:50%;vertical-align:middle;margin-right:6px;image-rendering:auto}
.page-icon{width:42px;height:42px;object-fit:cover;border-radius:50%;vertical-align:middle;margin-right:8px}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}
.disenchant-list{display:grid;gap:8px;margin-top:12px}
.disenchant-row{display:grid;grid-template-columns:32px 150px minmax(180px,1fr) 100px;gap:8px;align-items:center}
.runtime-card{border:1px solid var(--border)}
.unique-picker{position:relative}
.unique-results{display:none;position:absolute;z-index:50;left:0;right:0;top:100%;max-height:260px;overflow:auto;background:var(--panel,#fff);border:1px solid var(--border);border-radius:8px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.unique-suggestion{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 9px;border-radius:5px;cursor:pointer}
.unique-suggestion:hover{background:rgba(127,127,127,.14)}
@media(max-width:700px){.disenchant-row{grid-template-columns:28px 1fr}.disenchant-row input,.disenchant-row select{width:100%}}.shipment-input{max-width:190px}.nowrap{white-space:nowrap}
@media(max-width:650px){header{padding:18px 12px 10px}main{padding:0 12px 25px}.tabs{position:static}.row{grid-template-columns:1fr 95px}table{font-size:12px}th,td{padding:6px}}
</style>
</head>

?"Exact shipment value reached."

});
}

function computeShipment(target,avail){
let n=avail.length,qty=Array(n).fill(0),dust=n-1;
let remaining=target;
let nonDust=avail.map((a,i)=>i===dust?0:a);
if(target<=0)return {qty,total:0,items:0};
let best=null;
function consider(q){let v=q.reduce((s,x,i)=>s+x*resources[i][1],0);let it=q.reduce((s,x)=>s+x,0);let exact=v===target;let score=exact?1e12+it*-0.01:v; if(!best||score>best.score)best={q:q.slice(),v,it,score};}
function greedy(){let q=Array(n).fill(0),rem=target;let order=nonDust.map((a,i)=>[i,a]).sort((a,b)=>resources[b[0]][1]-resources[a[0]][1]);
for(const [i,a] of order){let take=Math.min(a,Math.floor(rem/resources[i][1]));q[i]=take;rem-=take*resources[i][1]}
q[dust]=Math.min(avail[dust],Math.max(0,rem));consider(q)}
greedy();
function dfs(i,rem,q,steps){
if(i===n-1){let take=Math.min(avail[dust],rem);q[dust]=take;consider(q);q[dust]=0;return}
if(steps>350000)return;
let val=resources[i][1],max=Math.min(avail[i],Math.floor(rem/val));
for(let x=max;x>=Math.max(0,max-80);x--){q[i]=x;dfs(i+1,rem-x*val,q,steps+1);if(best&&best.v===target)break}
q[i]=0}
if(target<=2500 && n<=16)dfs(0,target,Array(n).fill(0),0);
let q=best.q,total=best.v;return {qty:q,total,items:q.reduce((s,x)=>s+x,0)};
}

function formatHours(h){
 if(!isFinite(h)) return "—";
 const mins=Math.max(0,Math.round(h*60));
 const d=Math.floor(mins/1440), hr=Math.floor((mins%1440)/60), m=mins%60;
 return (d?d+"d ":"")+(hr?hr+"h ":"")+(m||(!d&&!hr)?m+"m":"");
}
function treasuryRuntime(c){
 const hourly=catHourly(c), treasury=Math.max(0,Number(state.treasury)||0);
 return hourly>0?treasury/hourly:Infinity;
}
function updateRuntimePanels(){
 const c=cats.find(x=>x.id===state.tab); if(!c)return;
 const hourly=catHourly(c), runtime=treasuryRuntime(c);
 const h=document.querySelector(".runtime-hourly"), r=document.querySelector(".runtime-hours"), n=document.querySelector(".runtime-note");
 if(h)h.textContent=fmt(hourly)+"/hr";
 if(r)r.textContent=formatHours(runtime);
 if(n)n.textContent=hourly>0?"Using the shared Kingsmarch Treasury, this operation can be funded for approximately "+formatHours(runtime)+".":"Enter wages for active workers to calculate Treasury runtime.";
}
const uniqueCatalog={"Helmet":["Abyssus","Asenath's Chant","Devoto's Devotion","Eternal Damnation","Hrimnor's Resolve","Indigon","Lightpoacher","The Gull","The Three Dragons","Viridi's Veil"],"Body Armour":["Briskwrap","Carcass Jack","Cloak of Flame","Doppelgänger Guise","Kaom's Heart","Shavronne's Wrappings","Skin of the Lords","Tabula Rasa","The Covenant","The Ivory Tower"],"Gloves":["Asenath's Gentle Touch","Hrimsorrow","Null and Void","Shaper's Touch","Southbound","Tombfist","Thunderfist","Voidbringer"],"Boots":["Atziri's Step","Bubonic Trail","Kaom's Roots","Seven-League Step","Stampede","The Sorrow of the Divine","Voidwalker","Windscream"],"Weapon":["Cospri's Malice","Doomfletch's Prism","Ephemeral Edge","Headhunter","Mjölner","Nebuloch","Starforge","The Saviour","Void Battery"],"Bow":["Death's Opus","Darkscorn","Lioneye's Glare","Quill Rain","Windripper","Xoph's Nurture"],"Shield":["Aegis Aurora","Atziri's Reflection","Prism Guardian","Saffell's Frame","The Surrender"],"Quiver":["Maloney's Mechanism","Rigwald's Quills","Soul Strike","The Skirmish","Voidfletcher"],"Amulet":["Astramentis","Crystallised Omniscience","Presence of Chayula","Replica Dragonfang's Flight","The Aul's Uprising","The Pandemonius"],"Ring":["Call of the Brotherhood","Circle of Guilt","Mark of the Elder","Ming's Heart","Nostalgia","Profane Proxy","Shavronne's Revelation","Ventor's Gamble"],"Belt":["Auxium","Bisco's Leash","Headhunter","Mageblood","Meginord's Girdle","Perseverance","Stygian Vise","The Torrent's Reclamation"],"Flask":["Atziri's Promise","Bottled Faith","Dying Sun","Forbidden Taste","Lion's Roar","Taste of Hate","The Overflowing Chalice"],"Jewel":["Forbidden Flame","Forbidden Flesh","Inspired Learning","Megalomaniac","Watcher's Eye","Thread of Hope"]};
function setDisenchantRows(v){
 const n=Math.max(0,Math.min(100,Math.floor(Number(v)||0)));
 state.disenchantItems=state.disenchantItems||[];
 while(state.disenchantItems.length<n)state.disenchantItems.push({slot:"Helmet",unique:"",qty:1});
 state.disenchantItems=state.disenchantItems.slice(0,n); save(); render();
}
function setDisenchant(i,p,v){
 if(!state.disenchantItems?.[i])return;
 state.disenchantItems[i][p]=p==="qty"?Math.max(1,Number(v)||1):v; save();
}
function uniqueOptionsForSlot(slot){
 return uniqueCatalog[slot]||[];
}
function renderUniqueSuggestions(i,slot,query){
 const box=document.getElementById("unique-results-"+i);
 if(!box)return;
 const q=(query||"").trim().toLowerCase();
 const vals=uniqueOptionsForSlot(slot).filter(n=>!q||n.toLowerCase().includes(q)).slice(0,20);
 box.innerHTML=vals.length?vals.map(n=>`<button type="button" class="unique-suggestion" onclick="pickUnique(${i},'${esc(n).replace(/'/g,"&#39;")}')">${esc(n)}</button>`).join(""):`<div class="small">No matching unique in the built-in list. You can still enter the exact name manually.</div>`;
 box.style.display="block";
}
function pickUnique(i,name){
 setDisenchant(i,"unique",name);
 const input=document.getElementById("unique-input-"+i); if(input)input.value=name;
 const box=document.getElementById("unique-results-"+i); if(box)box.style.display="none";
}
function disenchantInputs(){
 const rows=state.disenchantItems||[];
 const slots=["Helmet","Body Armour","Gloves","Boots","Weapon","Bow","Shield","Quiver","Amulet","Ring","Belt","Flask","Jewel"];
 return `<div class="card"><h3>👻 Disenchant Queue</h3>
 <div class="field"><label>Number of item types</label><input type="number" min="0" max="100" step="1" value="${rows.length}" onchange="setDisenchantRows(this.value)"></div>
 <div class="small">Choose the item slot first. Then type part of the unique name — matching uniques appear immediately. The list is filtered by slot.</div>
 <div class="disenchant-list">${rows.map((x,i)=>`<div class="disenchant-row"><strong>${i+1}</strong>
 <select onchange="setDisenchant(${i},'slot',this.value);render()">${slots.map(v=>`<option ${x.slot===v?"selected":""}>${v}</option>`).join("")}</select>
 <div class="unique-picker"><input id="unique-input-${i}" type="search" autocomplete="off" placeholder="Search ${x.slot||"unique"}..." value="${esc(x.unique||"")}" onfocus="renderUniqueSuggestions(${i},'${esc(x.slot||"Helmet")}',this.value)" oninput="renderUniqueSuggestions(${i},'${esc(x.slot||"Helmet")}',this.value)" onchange="setDisenchant(${i},'unique',this.value)"><div id="unique-results-${i}" class="unique-results"></div></div>
 <input type="number" min="1" step="1" value="${x.qty||1}" onchange="setDisenchant(${i},'qty',this.value)">
 </div>`).join("")}</div></div>`;
}
function operationInputs(c){
 if(c.id==="mining") return `<div class="card"><h3>⛏️ Current ore</h3><div class="mini-grid">${c.items.map(([n])=>`<div class="field"><label>${esc(n)} Ore</label><input type="number" min="0" step="1" data-material="${c.id}|${n}" value="${state.materials?.[c.id+"|"+n]||0}"></div>`).join("")}</div><div class="small">Ore stock is tracked here; production-time estimates will use the game's current rates rather than guessing.</div></div>`;
 if(c.id==="smelting") return `<div class="card"><h3>🔥 Ore to smelt</h3><div class="mini-grid">${c.items.map(([n])=>`<div class="field"><label>${esc(n)} Ore</label><input type="number" min="0" step="1" data-material="${c.id}|${n}" value="${state.materials?.[c.id+"|"+n]||0}"></div>`).join("")}</div></div>`;
 if(c.id==="farming") return `<div class="card"><h3>🌾 Plot setup</h3><div class="mini-grid">${c.items.map(([n])=>`<div class="field"><label>${esc(n)} crop</label><select data-plot="${c.id}|${n}">${["Wheat","Corn","Pumpkin","Orgourd","Blue Zanthimum"].map(v=>`<option ${state.plots?.[c.id+"|"+n]===v?"selected":""}>${v}</option>`).join("")}</select></div>`).join("")}</div></div>`;
 if(c.id==="mapping") return `<div class="card"><h3>🗺️ Mapping operation</h3><div class="mini-grid"><div class="field"><label>Maps available</label><input type="number" min="0" step="1" data-map-input="count" value="${state.mapCount||0}"></div><div class="field"><label>Map tier</label><input type="number" min="1" max="17" step="1" data-map-input="tier" value="${state.mapTier||1}"></div></div></div>`;
 if(c.id==="shipping") return `<div class="card"><h3>🚢 Shipping operation</h3><div class="small">Build the shipment on the Shipment tab. This page uses the assigned ship crew wages and Treasury to calculate how long that crew can remain funded.</div></div>`;
 return "";
}
function workPage(c){
let total=c.items.reduce((s,[n])=>s+activeCount(c.id+"|"+n),0);
let global=globalWorkers(),over=total>c.max||global>90;
return `<div class="card"><h2>${iconImg(c.id,"page-icon")}${c.name}</h2><div class="notice">Workers are <b>inactive until their Wage / hour is greater than 0</b>. Only active workers count toward the 90-worker global limit and gold totals.</div><div class="statgrid"><div class="stat">Workers<b>${fmt(total)} / ${c.max}</b></div><div class="stat">Global<b>${fmt(global)} / 90</b></div><div class="stat">Hourly wages<b>${fmt(catHourly(c))}</b></div></div>
${over?`<div class="notice error">⚠️ Invalid allocation: ${total>c.max?c.name+" exceeds its maximum. ":""}${global>90?"Global workforce exceeds 90.":""}</div>`:""}
<div class="card runtime-card"><h3>💰 Treasury Runtime</h3><div class="statgrid"><div class="stat">Active wages<b class="runtime-hourly">${fmt(catHourly(c))}/hr</b></div><div class="stat">Treasury lasts<b class="runtime-hours">${formatHours(treasuryRuntime(c))}</b></div></div><div class="small runtime-note">${catHourly(c)>0?"Using the shared Kingsmarch Treasury, this operation can be funded for approximately "+formatHours(treasuryRuntime(c))+".":"Enter wages for active workers to calculate Treasury runtime."}</div><div class="small">Treasury Gold is entered once on the 📊 Totals tab and is shared by every Kingsmarch activity.</div></div>
${c.id==="disenchanting"?disenchantInputs():operationInputs(c)}
<div class="card" style="margin-top:14px"><h3>Assignments</h3>${c.items.map(([name,max])=>assignment(c,name,max)).join("")}</div></div>`;
}
function assignment(c,name,max){
let key=c.id+"|"+name,count=Math.min(max,Math.max(0,state.work[key]||0)), workers=state.workers?.[key]||[];
if(!state.workers)state.workers={};
while(workers.length<count)workers.push({level:1,wage:0});
workers=workers.slice(0,count);state.workers[key]=workers;
return `<div class="assignment"><div class="row"><strong>${esc(name)} <span class="small">(max ${max})</span> <span class="small">· active ${activeCount(key)}</span></strong><input type="number" min="0" max="${max}" step="1" value="${count}" onchange="setCount('${key}',this.value)"></div>
${count?`<div class="workers">${workers.map((w,i)=>`<div><strong>Worker ${i+1}</strong><div class="field"><label>Level / rank</label><input type="number" min="0" step="1" value="${w.level}" onchange="setWorker('${key}',${i},'level',this.value)"></div><div class="field"><label>Wage / hour</label><input type="number" min="0" step="0.01" value="${w.wage}" onchange="setWorker('${key}',${i},'wage',this.value)"></div></div>`).join("")}</div>`:"<div class='small'>No workers assigned.</div>"}</div>`;
}
function setCount(key,v){let n=Math.max(0,Math.floor(Number(v)||0));let c=cats.find(c=>c.items.some(x=>c.id+"|"+x[0]===key)),item=c.items.find(x=>c.id+"|"+x[0]===key);n=Math.min(n,item[1]);let projected=globalWorkers()-activeCount(key)+((state.workers?.[key]||[]).slice(0,n).filter(z=>(Number(z.wage)||0)>0).length);if(projected>90){alert("Global workforce limit is 90 active workers. Reduce another assignment or remove wages first.");return}state.work[key]=n;save();render()}
function setWorker(key,i,p,v){if(!state.workers)state.workers={};if(!state.workers[key])state.workers[key]=[];state.workers[key][i] ||= {level:1,wage:0};state.workers[key][i][p]=Number(v)||0;save();render()}
function activeCount(key){let w=state.workers?.[key]||[],count=state.work[key]||0;return w.slice(0,count).filter(z=>(Number(z.wage)||0)>0).length}
function globalWorkers(){return cats.reduce((s,c)=>s+c.items.reduce((x,[n])=>x+activeCount(c.id+"|"+n),0),0)}
function catHourly(c){return c.items.reduce((s,[n])=>{let k=c.id+"|"+n,w=state.workers?.[k]||[],count=state.work[k]||0;return s+w.slice(0,count).reduce((a,z)=>a+(Number(z.wage)||0),0)},0)}
function totals(){
 let rows=cats.map(c=>({c,workers:c.items.reduce((s,[n])=>s+activeCount(c.id+"|"+n),0),h:catHourly(c)}));
 let hourly=rows.reduce((s,r)=>s+r.h,0),treasury=Number(state.treasury)||0,other=Number(state.otherGold)||0,runtime=hourly>0?treasury/hourly:Infinity;
 return `<div class="grid"><div class="card wide"><h2>📊 Workforce totals</h2><div class="statgrid"><div class="stat">Active workers<b class="tot-workers">${fmt(globalWorkers())} / 90</b></div><div class="stat">Hourly wages<b class="tot-hourly">${fmt(hourly)}</b></div><div class="stat">Treasury runtime<b class="tot-runtime">${formatHours(runtime)}</b></div></div>
 <div style="overflow:auto;margin-top:14px"><table class="totals-table"><thead><tr><th>Work Type</th><th class="num">Workers</th><th class="num">Maximum</th><th class="num">Hourly wages</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.c.name}</td><td class="num">${fmt(r.workers)}</td><td class="num">${r.c.max}</td><td class="num">${fmt(r.h)}</td></tr>`).join("")}<tr><th>TOTAL</th><th class="num">${fmt(globalWorkers())}</th><th class="num">90</th><th class="num">${fmt(hourly)}</th></tr></tbody></table></div></div>
 <div class="card"><h2>💰 Treasury</h2><div class="field"><label>Kingsmarch Treasury Gold</label><input type="number" min="0" step="1" data-path="treasury" value="${state.treasury||0}"></div><div class="field"><label>Other one-time gold costs</label><input type="number" min="0" step="1" data-path="otherGold" value="${state.otherGold}"></div><div class="statgrid"><div class="stat">Treasury lasts<b class="tot-runtime">${formatHours(runtime)}</b></div><div class="stat">Treasury gold<b>${fmt(treasury)}</b></div></div><div class="small">Runtime is based on current hourly wages. Each work tab also tracks its own operation inputs.</div></div>
 <div class="card"><h2>💾 Save / Load</h2><div class="actions"><button onclick="exportData()">⬇️ Export Save</button><button onclick="document.getElementById('importFile').click()">⬆️ Import Save</button><button onclick="resetAll()">🔄 Reset Everything</button></div><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"><div class="small" style="margin-top:10px">Export includes shipment, workforce, worker details, operation inputs, disenchant queue, and Treasury.</div></div>
 <div class="card"><h2>⚙️ Workforce Tools</h2><div class="actions"><button onclick="demoWorkers()">Load demo workers</button><button onclick="clearWorkers()">Clear all workers</button></div></div></div>`;
}
function exportData(){
const payload={version:2,exportedAt:new Date().toISOString(),data:state};
const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="kingsmarch-calculator-save.json";
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importData(input){
const file=input.files&&input.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=()=>{
try{
const payload=JSON.parse(reader.result);
const data=payload&&payload.data?payload.data:payload;
if(!data||typeof data!=="object"||!data.ship||!data.work){
throw new Error("Invalid save file");
}
if(!data.ship.inventory||!data.ship.reserve||typeof data.ship.target==="undefined"){
throw new Error("Missing shipment data");
}
state={
ship:{
target:Number(data.ship.target)||0,
inventory:{...Object.fromEntries(resources.map(r=>[r[0],0])),...data.ship.inventory},
reserve:{...Object.fromEntries(resources.map(r=>[r[0],0])),...data.ship.reserve}
},
work:{...(data.work||{})},
workers:{...(data.workers||{})},
duration:Number(data.duration)||0,
currentGold:Number(data.currentGold)||0,
otherGold:Number(data.otherGold)||0,treasury:Number(data.treasury)||0,materials:{...(data.materials||{})},plots:{...(data.plots||{})},mapCount:Number(data.mapCount)||0,mapTier:Number(data.mapTier)||1,disenchantItems:Array.isArray(data.disenchantItems)?data.disenchantItems:[],tab:"totals"
};
cats.forEach(c=>c.items.forEach(([name,max])=>{
const key=c.id+"|"+name;
state.work[key]=Math.max(0,Math.min(max,Math.floor(Number(state.work[key])||0)));
state.workers[key]=Array.isArray(state.workers[key])?state.workers[key].slice(0,state.work[key]).map(w=>({
level:Number(w.level)||0,wage:Number(w.wage)||0
})):[];
}));
save();
input.value="";
render();
alert("Save imported successfully.");
}catch(e){
input.value="";
alert("Could not import that file. Please select a Kingsmarch Calculator JSON save.");
}
};
reader.onerror=()=>{input.value="";alert("Could not read the selected file.")};
reader.readAsText(file);
}
function resetAll(){if(confirm("Reset all calculator data? This will clear your shipment inventory, reserves, workforce, worker details, gold settings, and saved browser data.")){localStorage.removeItem("kingsmarchCalc");location.reload()}}
render();
</script>
